<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anonymous Voices</title>
    <style>
        /* CSS - This makes the website look beautiful */
        body {
            background-color: #1a1a1a; /* Dark background */
            color: #e0e0e0; /* Light text */ 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        h1 {
            margin-top: 40px;
            font-weight: 300;
            letter-spacing: 2px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: #252525;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        textarea {
            width: 100%;
            height: 100%;
            background-color: #333;
            border: 2px solid #444;
            border-radius: 8px;
            color: white;
            padding: 15px;
            font-size: 16px;
            resize: none; User can't resize the box */
            box-sizing: border-box;
            outline: none;
            transition: border 0.3s;
        }

        textarea:focus {
            border-color: #6c5ce7;
        }

        button {
            margin-top: 15px;
            background-color: #6c5ce7;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.1s;
        }

        button:hover {
            background-color: #5b4bc4;
        }

        button:active {
            transform: scale(0.95);
        }

        #message-board {
            margin-top: 40px;
            width: 100%;
            max-width: 600px;
        }

        .message-card {
            background-color: #2d2d2d;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 4px solid #6c5ce7;
            animation: fadeIn 0.5s ease;
        }

        .timestamp {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    
    <h1>🗣️ Anonymous Voices</h1>
    <p>Say what you feel. No one knows it's you.</p>

    <div class="container">
        <textarea id="messageInput" placeholder="Type your feelings here..."></textarea>
        <button oneclick="postMessage()">Send Anonymously</button>
    </div>

    <div id="message-board">
        Message will apper here 
    </div>

    <script>
        // JavaScript - Thi makes the website work
        function postMessage() {
            const input. = document.getElementById('messageInput');
            const text = input.value;           
        
            if (text.trim() === "") {
                alert("Please write something first!");
                return;
            }

            const board = document.getElementById('message-board');

            // Create the message card HTML
            const newMessage = document.createElement('div');
            newMessage.classList.add('message-card');

            // Get current time 
            const time = new Date().toLocaleTimeString();

            newMessage.innerHTML = `
                <div class="timestamp">Today at ${time}</div>
                <div class="text">${text}</div>
                `;

                // Add new message to th top
                board.prepend(newMessage);

                // Clear the input box
                input.value = "";
        }
    </script>

</body>
</html>
